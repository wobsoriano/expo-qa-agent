name: Mobile QA

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  APP_PATH: build/expoclerkqaagent.app

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-qa/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix agent-qa
          echo "$GITHUB_WORKSPACE/agent-qa/node_modules/.bin" >> "$GITHUB_PATH"

      # The fingerprint covers native inputs only (deps, config plugins, app.json).
      # It deliberately ignores JS source, so the bundle is re-embedded below.
      - name: Compute native fingerprint
        id: fingerprint
        run: |
          hash="$(npx @expo/fingerprint fingerprint:generate --platform ios \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).hash))")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: app-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_PATH }}
          key: ios-app-${{ runner.os }}-${{ steps.fingerprint.outputs.hash }}

      - name: Build app (Release)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: npx expo run:ios --configuration Release --device generic --output ./build --no-bundler

      # A cached shell carries the JS it was built with. Re-embed this commit's
      # bundle so the agent always tests the code in the PR.
      - name: Embed current JS bundle
        if: steps.app-cache.outputs.cache-hit == 'true'
        run: |
          npx expo export:embed --platform ios --dev false \
            --bundle-output "$APP_PATH/main.jsbundle" \
            --assets-dest "$APP_PATH"

      # No model pinned, so a runner-image bump cannot break the job.
      - name: Boot simulator
        uses: futureware-tech/simulator-action@v5
        with:
          os: iOS
          wait_for_boot: true

      - name: Install app and open QA session
        run: ./scripts/setup-ios-sim.sh "$APP_PATH"

      - name: Run QA agent
        id: qa
        working-directory: agent-qa
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          message="$(printf 'Pull request under review:\n\nTitle: %s\n\nDescription:\n%s' \
            "$PR_TITLE" "${PR_BODY:-(no description)}")"

          xcrun simctl io booted recordVideo --codec h264 --force "$RUNNER_TEMP/qa-run.mp4" &
          recorder_pid=$!

          npm run --silent qa -- --json --message "$message" > qa-result.json || true

          # SIGINT lets the recorder finalise the file; SIGKILL would corrupt it.
          kill -INT "$recorder_pid" 2>/dev/null || true
          wait "$recorder_pid" 2>/dev/null || true

          outcome="$(jq -r '.outcome // "unknown"' qa-result.json)"
          report="$(jq -r '.message // ""' qa-result.json)"

          case "$report" in
            *"QA: PASS"*) verdict=pass ;;
            *"QA: FAIL"*) verdict=fail ;;
            *) verdict=inconclusive ;;
          esac
          [ "$outcome" = "completed" ] || verdict=inconclusive

          printf '%s\n' "$report"
          {
            echo "outcome=$outcome"
            echo "verdict=$verdict"
            echo "report<<QA_REPORT_EOF"
            printf '%s\n' "$report"
            echo "QA_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-recording
          path: ${{ runner.temp }}/qa-run.mp4
          if-no-files-found: ignore

      # The attachments endpoint rejects the Actions token, so inline playback
      # needs a user token. Without it the comment links the artifact instead.
      - name: Publish recording
        if: always()
        id: recording
        env:
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          video="$RUNNER_TEMP/qa-run.mp4"
          [ -s "$video" ] || { echo "::notice::No recording captured."; exit 0; }
          [ -n "$ATTACHMENTS_TOKEN" ] || { echo "::notice::ATTACHMENTS_TOKEN not set; skipping inline video."; exit 0; }

          response="$(curl -sS -X POST \
            "https://uploads.github.com/user-attachments/assets?name=qa-run.mp4&content_type=video/mp4&repository_id=$REPOSITORY_ID" \
            -H "Authorization: Bearer $ATTACHMENTS_TOKEN" \
            -H "Accept: application/json" \
            --data-binary @"$video")"

          url="$(printf '%s' "$response" | jq -r '.url // empty')"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Upload rejected: $(printf '%s' "$response" | head -c 200)"
          fi

      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          VERDICT: ${{ steps.qa.outputs.verdict }}
          REPORT: ${{ steps.qa.outputs.report }}
          VIDEO_URL: ${{ steps.recording.outputs.url }}
        run: |
          case "$VERDICT" in
            pass) header='### Mobile QA (iOS) — passed' ;;
            fail) header='### Mobile QA (iOS) — failed' ;;
            *)    header='### Mobile QA (iOS) — inconclusive' ;;
          esac

          {
            echo "$header"
            echo
            printf '%s\n' "${REPORT:-The agent produced no report. See the job log.}"
            echo
            if [ -n "$VIDEO_URL" ]; then
              echo "$VIDEO_URL"
              echo
            fi
            echo "[Full run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [recording]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
          } > comment.md

          gh pr comment "$PR_NUMBER" --body-file comment.md

      - name: Enforce verdict
        if: always()
        run: |
          case "${{ steps.qa.outputs.verdict }}" in
            pass) echo "QA passed." ;;
            fail) echo "::error::QA agent reported failures."; exit 1 ;;
            *) echo "::error::QA agent returned no usable verdict."; exit 1 ;;
          esac
